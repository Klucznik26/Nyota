name: Temporary TABLE validation

on:
  push:
    branches:
      - table-widget

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[table-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: table-widget
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev

      - name: Apply TABLE upgrade
        run: python3 scripts/apply_table_widget.py

      - name: Build interpreter
        run: |
          make clean
          make

      - name: Run regression tests
        run: make test

      - name: Run headless graphics tests
        run: make test-graph

      - name: Commit validated implementation
        run: |
          git config user.name "Nyota CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/nyota.c scripts/run_tests.sh docs/nyota.md docs/nyota_v05.md README.md tests/
          git commit -m "TABLE: named data presentation widget and tests [table-applied]"
          git push origin HEAD:table-widget
