name: Temporary LIST stabilization

on:
  push:
    branches:
      - list-complete

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[list-upgrade-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: list-complete
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev

      - name: Apply LIST upgrade
        run: python3 scripts/tmp_list_upgrade.py

      - name: Build interpreter
        run: |
          make clean
          make

      - name: Run regression tests
        run: make test

      - name: Run headless graphics tests
        run: make test-graph

      - name: Remove temporary upgrade machinery
        run: |
          rm -f scripts/tmp_list_upgrade.py
          rm -f .github/workflows/tmp-list-upgrade.yml

      - name: Commit validated LIST implementation
        run: |
          git config user.name "Nyota CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "LIST: complete operations, iteration, random generators and tests [list-upgrade-applied]"
          git push origin HEAD:list-complete
