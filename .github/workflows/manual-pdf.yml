name: Build Nyota manual PDF

on:
  push:
    branches:
      - nyota-v05-complete
    paths:
      - ".github/workflows/manual-pdf.yml"
      - "tools/manual/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nyota-v05-complete

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab==4.4.9
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Reconstruct manual generator
        run: |
          mkdir -p /tmp/nyota-manual
          cat \
            tools/manual/build_manual.py.gz.b64.part1 \
            tools/manual/build_manual.py.gz.b64.part2 \
            tools/manual/build_manual.py.gz.b64.part3 \
            tools/manual/build_manual.py.gz.b64.part4 \
            | base64 -d | gzip -dc > /tmp/nyota-manual/build_manual.py
          python -m py_compile /tmp/nyota-manual/build_manual.py

      - name: Build manual
        env:
          NYOTA_MANUAL_OUT: assets/Nyota_Podrecznik_0.5_PL.pdf
        run: |
          mkdir -p assets
          python /tmp/nyota-manual/build_manual.py
          test -s assets/Nyota_Podrecznik_0.5_PL.pdf
          file assets/Nyota_Podrecznik_0.5_PL.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Nyota_Podrecznik_0.5_PL.pdf
          if git diff --cached --quiet; then
            echo "Manual PDF unchanged"
            exit 0
          fi
          git commit -m "Docs: rebuild Nyota manual PDF [skip ci]"
          git push origin HEAD:nyota-v05-complete
