name: Temporary MARK validation

on:
  push:
    branches:
      - mark-complete

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[mark-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mark-complete
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev

      - name: Apply MARK upgrade
        run: python3 scripts/apply_mark_upgrade.py

      - name: Build interpreter
        run: |
          make clean
          make

      - name: Run regression tests
        run: make test

      - name: Run headless graphics tests
        run: make test-graph

      - name: Commit validated MARK implementation
        run: |
          git config user.name "Nyota CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f scripts/apply_mark_upgrade.py .github/workflows/tmp-mark-complete.yml
          git add -A
          git commit -m "MARK: complete operations, statistics and tests [mark-applied]"
          git push origin HEAD:mark-complete
