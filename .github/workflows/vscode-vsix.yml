name: VS Code VSIX

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package-vsix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate extension metadata
        working-directory: editors/vscode
        run: |
          node -e "const p=require('./package.json'); if(p.version !== '0.5.0') process.exit(1)"
          node -e "JSON.parse(require('fs').readFileSync('syntaxes/nyota.tmLanguage.json','utf8'))"

      - name: Package VSIX
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --out nyota-language-support-0.5.0.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: nyota-vscode-0.5.0
          path: editors/vscode/nyota-language-support-0.5.0.vsix
          if-no-files-found: error
