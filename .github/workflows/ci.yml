name: Nyota CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev
      - name: Validate VS Code language extension
        run: |
          python3 -m json.tool editors/vscode/package.json >/dev/null
          python3 -m json.tool editors/vscode/language-configuration.json >/dev/null
          python3 -m json.tool editors/vscode/syntaxes/nyota.tmLanguage.json >/dev/null
          node --check editors/vscode/extension.js
          node --check editors/vscode/color-palette.js
          node editors/vscode/test-colors.js
      - name: Build
        run: make
      - name: Regression tests
        run: make test
      - name: Headless graphics tests
        run: make test-graph
