name: Temporary SPRITE validation

on:
  push:
    branches:
      - sprite-basic

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[sprite-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sprite-basic
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev

      - name: Apply SPRITE upgrade
        run: python3 scripts/apply_sprite_upgrade.py

      - name: Build interpreter
        run: |
          make clean
          make

      - name: Run regression tests
        run: make test

      - name: Run headless graphics tests
        run: make test-graph

      - name: Commit validated SPRITE implementation
        run: |
          git config user.name "Nyota CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f scripts/apply_sprite_upgrade.py .github/workflows/tmp-sprite-basic.yml
          git add -A
          git commit -m "SPRITE: basic named sprites, movement, visibility and collision [sprite-applied]"
          git push origin HEAD:sprite-basic
